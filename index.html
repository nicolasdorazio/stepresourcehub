<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The STEP Resource Hub has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://whartonstep.github.io/resourcehub/">
<script>
  (function () {
    var oldPrefix = '/stepresourcehub';
    var path = location.pathname;
    if (path.toLowerCase().indexOf(oldPrefix.toLowerCase()) === 0) path = path.slice(oldPrefix.length);
    if (path.charAt(0) !== '/') path = '/' + path;
    location.replace('https://whartonstep.github.io/resourcehub' + path + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="1; url=https://whartonstep.github.io/resourcehub/">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; padding: 60px 20px;">
<p>The STEP Resource Hub has moved to <a href="https://whartonstep.github.io/resourcehub/">whartonstep.github.io/resourcehub/</a>.</p>
<p>If you aren't sent there automatically, click the link above.</p>
</body>
</html>
